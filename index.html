<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orario · Liceo Statale Plinio</title>
<style>
  :root{
    --paper:#f7f5f0;
    --card:#fffdfa;
    --ink:#232a33;
    --muted:#6b7280;
    --line:#ddd7c8;
    --blue:#1d4e89;
    --blue-dim:#e9eef5;
    --amber:#b9711f;
    --amber-dim:#f7ecdd;
    --free:#f1efe9;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.4;
  }
  .wrap{
    max-width:920px;
    margin:0 auto;
    padding:28px 20px 60px;
  }
  header{
    margin-bottom:22px;
  }
  .kicker{
    font-family: ui-serif, Georgia, "Times New Roman", serif;
    font-size:13px;
    letter-spacing:.04em;
    color:var(--amber);
    margin:0 0 2px;
  }
  h1{
    font-family: ui-serif, Georgia, "Times New Roman", serif;
    font-weight:600;
    font-size:30px;
    margin:0 0 6px;
    color:var(--ink);
  }
  .subtitle{
    color:var(--muted);
    font-size:14.5px;
    margin:0;
  }

  .tabs{
    display:flex;
    gap:6px;
    margin:26px 0 14px;
    border-bottom:1px solid var(--line);
  }
  .tab{
    appearance:none;
    border:none;
    background:none;
    font-size:15px;
    font-weight:600;
    color:var(--muted);
    padding:9px 4px 11px;
    margin-right:20px;
    cursor:pointer;
    border-bottom:2.5px solid transparent;
    transition:color .15s, border-color .15s;
  }
  .tab:hover{ color:var(--ink); }
  .tab.active{
    color:var(--blue);
    border-bottom-color:var(--blue);
  }

  .picker{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
    margin-bottom:22px;
  }
  .picker label{
    font-size:13.5px;
    color:var(--muted);
  }
  select{
    flex:1;
    min-width:220px;
    font-size:16px;
    padding:10px 12px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink);
    font-family:inherit;
  }
  select:focus{
    outline:2px solid var(--blue);
    outline-offset:1px;
  }

  .empty-state{
    color:var(--muted);
    font-size:14.5px;
    padding:30px 4px;
    text-align:center;
    border:1px dashed var(--line);
    border-radius:10px;
  }

  .grid-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
  }
  .banner{
    padding:10px 16px;
    font-size:12.5px;
    color:var(--amber);
    background:var(--amber-dim);
    border-bottom:1px solid var(--line);
  }
  .sub-meta{
    font-size:12px;
    color:var(--muted);
    padding:2px 0 0;
  }
  .grid-title{
    background:var(--blue);
    color:#fff;
    padding:12px 16px;
    font-weight:600;
    font-size:15.5px;
  }
  .table-scroll{
    overflow-x:auto;
  }
  .scroll-hint{
    display:none;
    text-align:center;
    font-size:11.5px;
    color:var(--muted);
    padding:6px 0 2px;
  }
  @media (max-width:700px){
    .scroll-hint{ display:block; }
  }
  table{
    width:100%;
    border-collapse:collapse;
    min-width:640px;
    font-size:13px;
  }
  th{
    background:var(--blue-dim);
    color:var(--blue);
    font-size:12.5px;
    font-weight:700;
    padding:8px 4px;
    border:1px solid var(--line);
    text-align:center;
  }
  td{
    border:1px solid var(--line);
    text-align:center;
    padding:7px 5px;
    vertical-align:middle;
    height:44px;
  }
  td.ora{
    background:#f0eee7;
    font-weight:600;
    font-size:11.5px;
    color:var(--muted);
    white-space:nowrap;
    width:12%;
  }
  td.free{ background:var(--free); color:#b7b2a6; font-style:italic; font-size:12.5px; }
  td.lesson{ background:#fffef9; }
  td.dash{ background:var(--free); color:#c9c4b6; }
  .primary{
    display:block;
    font-weight:700;
    color:var(--ink);
    font-size:13.5px;
  }
  .secondary{
    display:block;
    color:var(--blue);
    font-size:11px;
    margin-top:2px;
  }
  .tertiary{
    display:block;
    color:var(--muted);
    font-size:10px;
    margin-top:1px;
  }
  .note{
    display:block;
    color:var(--amber);
    font-size:10px;
    margin-top:2px;
    font-weight:600;
  }
  .special{
    font-weight:700;
    color:var(--amber);
  }
  tr.interval td{
    background:var(--amber-dim);
    color:var(--amber);
    font-size:10.5px;
    font-weight:700;
    letter-spacing:.03em;
    height:16px;
    padding:2px;
  }

  footer{
    margin-top:28px;
    color:var(--muted);
    font-size:12px;
    text-align:center;
  }

  @media (max-width:520px){
    h1{ font-size:24px; }
    .tab{ font-size:14px; margin-right:14px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="kicker">Liceo Statale Plinio</p>
    <h1>Orario settimanale</h1>
    <p class="subtitle">Consulta l'orario definitivo dal 28 settembre 2026 per docente, classe o aula.</p>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab active" data-mode="docente">Docente</button>
    <button class="tab" data-mode="classe">Classe</button>
    <button class="tab" data-mode="aula">Aula</button>
    <button class="tab" data-mode="sostituzioni">Sostituzioni</button>
  </nav>

  <div class="picker">
    <label id="pickerLabel" for="entitySelect">Scegli un docente</label>
    <select id="entitySelect"></select>
  </div>

  <div id="output"></div>

  <footer>Dati estratti dall'orario definitivo del Liceo Statale Plinio (documento Index Education, dal 28 settembre 2026).</footer>
</div>

const docentiMap = {};
DATA.docenti.forEach(t => docentiMap[t.nome] = t);

const perClasseIdx = {};
Object.keys(DATA.per_classe).forEach(k => { perClasseIdx[k] = DATA.per_classe[k]; });
const perAulaIdx = {};
Object.keys(DATA.per_aula).forEach(k => { perAulaIdx[k] = DATA.per_aula[k]; });

let mode = 'docente';

const tabs = document.querySelectorAll('.tab');
const select = document.getElementById('entitySelect');
const pickerLabel = document.getElementById('pickerLabel');
const output = document.getElementById('output');

function niceClassLabel(c){
  return c.replace(/_$/,'').replace(/_/g,' ');
}

function optionsForMode(m){
  if(m==='docente') return DATA.docenti.map(t=>t.nome).sort((a,b)=>a.localeCompare(b,'it'));
  if(m==='classe') return DATA.classi.slice().sort((a,b)=>a.localeCompare(b,'it'));
  return DATA.aule.slice().sort((a,b)=>a.localeCompare(b,'it'));
}

function labelForMode(m){
  return m==='docente' ? 'Scegli un docente' : m==='classe' ? 'Scegli una classe' : 'Scegli un\u2019aula';
}

const pickerEl = document.querySelector('.picker');

function setMode(m){
  mode = m;
  tabs.forEach(t=>t.classList.toggle('active', t.dataset.mode===m));
  if(m==='sostituzioni'){
    pickerEl.style.display = 'none';
    renderSostituzioni();
    return;
  }
  pickerEl.style.display = '';
  pickerLabel.textContent = labelForMode(m);
  const opts = optionsForMode(m);
  select.innerHTML = opts.map(o=>`<option value="${escapeAttr(o)}">${escapeHtml(m==='classe'?niceClassLabel(o):o)}</option>`).join('');
  if(opts.length){
    select.value = opts[0];
    render();
  } else {
    output.innerHTML = '<div class="empty-state">Nessun dato disponibile.</div>';
  }
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s){ return escapeHtml(s); }

// --- cell lookup per mode ---
function cellForDocente(name, day, period){
  const cells = docentiMap[name].giorni[day] || [];
  return cells.find(c => period>=c.p1 && period<=c.p2) || null;
}
function cellForList(list, day, period){
  return (list||[]).filter(e => e.day===day && period>=e.p1 && period<=e.p2);
}

function renderCellContent(m, day, period){
  if(m==='docente'){
    const c = cellForDocente(select.value, day, period);
    if(!c || c.type==='free') return {cls:'free', html:'&mdash;'};
    if(c.type==='special') return {cls:'lesson', html:`<span class="special">${escapeHtml(c.code)}</span>`};
    if(c.type==='lesson' || c.type==='substitution'){
      const classi = (c.classi||[]).map(niceClassLabel).join(' + ') || '&mdash;';
      let html = `<span class="primary">${escapeHtml(classi)}</span>`;
      if(c.aula) html += `<span class="secondary">${escapeHtml(c.aula)}</span>`;
      if(c.type==='substitution') html += `<span class="note">sost. ${escapeHtml(c.docente_sost)}</span>`;
      return {cls:'lesson', html};
    }
    return {cls:'free', html:'&mdash;'};
  }
  if(m==='classe'){
    const entries = cellForList(perClasseIdx[select.value], day, period);
    if(!entries.length) return {cls:'free', html:'&mdash;'};
    const html = entries.map(e=>{
      let h = `<span class="primary">${escapeHtml(e.docente)}</span>`;
      if(e.aula) h += `<span class="secondary">${escapeHtml(e.aula)}</span>`;
      if(e.altre_classi && e.altre_classi.length) h += `<span class="tertiary">con ${escapeHtml(e.altre_classi.map(niceClassLabel).join(', '))}</span>`;
      if(e.note) h += `<span class="note">${escapeHtml(e.note)}</span>`;
      return h;
    }).join('<hr style="border:none;border-top:1px dashed var(--line);margin:4px 0;">');
    return {cls:'lesson', html};
  }
  // aula
  const entries = cellForList(perAulaIdx[select.value], day, period);
  if(!entries.length) return {cls:'free', html:'&mdash;'};
  const html = entries.map(e=>{
    let h = `<span class="primary">${escapeHtml(e.docente)}</span>`;
    h += `<span class="secondary">${escapeHtml((e.classi||[]).map(niceClassLabel).join(' + '))}</span>`;
    if(e.note) h += `<span class="note">${escapeHtml(e.note)}</span>`;
    return h;
  }).join('<hr style="border:none;border-top:1px dashed var(--line);margin:4px 0;">');
  return {cls:'lesson', html};
}

function render(){
  const name = select.value;
  if(!name){ output.innerHTML = ''; return; }

  let title = name;
  if(mode==='classe') title = 'Classe ' + niceClassLabel(name);
  if(mode==='aula') title = 'Aula ' + name;

  let html = `<div class="grid-card"><div class="grid-title">${escapeHtml(title)}</div><div class="table-scroll"><table>`;
  html += '<tr><th>Ora</th>' + DAYS.map(d=>`<th>${DAY_LABELS[d]}</th>`).join('') + '</tr>';

  ROWS.forEach(row => {
    if(row.kind==='interval'){
      html += `<tr class="interval"><td colspan="${DAYS.length+1}">${row.label}</td></tr>`;
      return;
    }
    const p = row.p;
    html += `<tr><td class="ora">${PERIOD_TIME[p]}</td>`;
    DAYS.forEach(day=>{
      if(p > MAX_PERIOD[day]){
        html += `<td class="dash">&nbsp;</td>`;
        return;
      }
      const {cls, html:cellHtml} = renderCellContent(mode, day, p);
      html += `<td class="${cls}">${cellHtml}</td>`;
    });
    html += '</tr>';
  });

  html += '</table></div>';
  html += '<div class="scroll-hint">◂ scorri per vedere tutti i giorni ▸</div>';
  html += '</div>';
  output.innerHTML = html;
}

// ============ Sostituzioni giornaliere ============
// Legge ogni volta il file "sostituzioni.xls" (stesso nome, sovrascritto ogni
// mattina) che deve stare nella stessa cartella di questa pagina.

// Se una classe del file sostituzioni non viene riconosciuta automaticamente,
// aggiungi qui la corrispondenza: "CODICE NEL FILE" : "codice esatto in DATA.classi"
const CLASS_ALIASES = {
};

// Classi articolate: il codice nel file sostituzioni indica l'intero gruppo
// (usato per le materie in cui le sezioni restano unite, es. religione, ed. fisica),
// che nell'orario normale corrisponde a più codici distinti.
const COMBINED_CLASSES = {
  '3ACSA': ['3ACSA_LC', '3ACSA_SA'],   // liceo classico Cambridge + scienze applicate
  '2ASA':  ['2ASSA_LS', '2ASSA_SA'],   // scientifico Cambridge + scienze applicate Cambridge
  '1ASSA': ['1SABS_LS', '1SABS_SA'],   // scienze applicate Cambridge + scientifico
};

function normCode(s){
  return String(s||'').trim().toUpperCase().replace(/_+$/,'');
}

function resolveClasse(raw){
  const key = normCode(raw);
  if(!key) return null;
  if(COMBINED_CLASSES[key]) return COMBINED_CLASSES[key].slice();
  if(CLASS_ALIASES[normCode(key)]) return CLASS_ALIASES[normCode(key)];
  const matches = DATA.classi.filter(c => normCode(c) === key);
  if(matches.length === 1) return matches[0];
  return null; // non trovata, o ambigua tra più sezioni (es. 3ACSA_LC/3ACSA_SA)
}

function resolveDocente(raw){
  const key = String(raw||'').trim().toUpperCase();
  if(!key) return null;
  const matches = DATA.docenti.filter(t => {
    const surname = t.nome.split(' ')[0].toUpperCase();
    return surname === key;
  });
  if(matches.length === 1) return {nome:matches[0].nome, ambiguo:false};
  if(matches.length > 1) return {nome:matches.map(m=>m.nome).join(' o '), ambiguo:true};
  return null;
}

const NOTE_PATTERNS = /GITA|ENTRA|USCITA|RIENTRO|VIAGGIO|VISITA|SCIOPERO|ASSEMBLEA/i;

function classifyTesto(testo){
  if(!testo) return 'vuoto';
  if(NOTE_PATTERNS.test(testo) || /\d/.test(testo)) return 'nota';
  return 'sostituzione';
}

function parseSostituzioniSheet(rows){
  let titolo = '';
  let notaGenerale = '';
  (rows[0]||[]).forEach(cell => {
    const s = String(cell==null?'':cell).trim();
    if(!s) return;
    if(!titolo && /LUNED|MARTED|MERCOLED|GIOVED|VENERD|SABAT|DOMENIC/i.test(s)) titolo = s;
    else if(!notaGenerale && s.length>3) notaGenerale = s;
  });
  let giorno = null;
  if(/LUNED/i.test(titolo)) giorno='Lunedi';
  else if(/MARTED/i.test(titolo)) giorno='Martedi';
  else if(/MERCOLED/i.test(titolo)) giorno='Mercoledi';
  else if(/GIOVED/i.test(titolo)) giorno='Giovedi';
  else if(/VENERD/i.test(titolo)) giorno='Venerdi';
  else if(/SABAT/i.test(titolo)) giorno='Sabato';

  const entries = [];
  for(let r=0; r<rows.length; r++){
    const row = rows[r]||[];
    const classeCols = [];
    row.forEach((c,idx)=>{ if(String(c==null?'':c).trim().toUpperCase()==='CLASSE') classeCols.push(idx); });
    if(!classeCols.length) continue;
    for(let k=1; k<=6; k++){
      const dataRow = rows[r+k];
      if(!dataRow) break;
      if(dataRow.some(c => String(c==null?'':c).trim().toUpperCase()==='CLASSE')) break;
      classeCols.forEach(ccol=>{
        const classeRaw = String(dataRow[ccol]==null?'':dataRow[ccol]).trim();
        const testoRaw = String(dataRow[ccol+1]==null?'':dataRow[ccol+1]).trim();
        if(!classeRaw && !testoRaw) return;
        const oraRaw = dataRow[ccol-1];
        const ora = Number(oraRaw) || k;
        const classeCanon = resolveClasse(classeRaw);
        const classeCanonList = Array.isArray(classeCanon) ? classeCanon : (classeCanon ? [classeCanon] : []);
        const tipo = classifyTesto(testoRaw);
        const entry = {
          ora, classeRaw,
          classe: classeCanonList.length ? classeCanonList.join(' + ') : classeRaw,
          classeCanonList,
          classeResolved: !!classeCanon,
          tipo, testoRaw
        };
        if(tipo==='sostituzione'){
          const d = resolveDocente(testoRaw);
          entry.docente = d ? d.nome : testoRaw;
          entry.docenteAmbiguo = d ? d.ambiguo : false;
        }
        entries.push(entry);
      });
    }
  }
  return {titolo, notaGenerale, giorno, entries};
}

function docenteNormale(classe, giorno, ora){
  const list = perClasseIdx[classe] || [];
  const hit = list.find(x => x.day===giorno && ora>=x.p1 && ora<=x.p2);
  return hit ? hit.docente : null;
}

function renderSostituzioni(){
  output.innerHTML = '<div class="empty-state">Carico il file delle sostituzioni…</div>';
  if(typeof XLSX === 'undefined'){
    output.innerHTML = '<div class="empty-state">Impossibile caricare la libreria di lettura Excel (controlla la connessione a internet).</div>';
    return;
  }
  fetch('sostituzioni.xls?_=' + Date.now(), {cache:'no-store'})
    .then(res => { if(!res.ok) throw new Error('not found'); return res.arrayBuffer(); })
    .then(buf => {
      const wb = XLSX.read(buf, {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
      const parsed = parseSostituzioniSheet(rows);
      renderSostituzioniTable(parsed);
    })
    .catch(() => {
      output.innerHTML = '<div class="empty-state">Nessun file "sostituzioni.xls" trovato in questa cartella.<br>Carica il file di oggi su GitHub con questo nome esatto per vederlo qui.</div>';
    });
}

function renderSostituzioniTable(parsed){
  const { titolo, notaGenerale, giorno, entries } = parsed;
  if(!entries.length){
    output.innerHTML = '<div class="empty-state">Il file è stato letto ma non contiene sostituzioni da mostrare.</div>';
    return;
  }
  entries.sort((a,b)=> a.ora-b.ora || String(a.classe).localeCompare(String(b.classe),'it'));

  let html = `<div class="grid-card"><div class="grid-title">${escapeHtml(titolo || 'Sostituzioni di oggi')}</div>`;
  if(notaGenerale) html += `<div class="banner">${escapeHtml(notaGenerale)}</div>`;
  if(!giorno) html += `<div class="banner">Non riesco a capire di che giorno è questo file: il confronto con l'orario normale potrebbe non funzionare.</div>`;
  html += '<div class="table-scroll"><table><tr><th>Ora</th><th>Classe</th><th>Docente sostituito</th><th>Sostituto / nota</th></tr>';
  entries.forEach(e=>{
    const normale = (giorno && e.classeResolved) ? docenteNormale(e.classeCanonList[0], giorno, e.ora) : null;
    html += '<tr>';
    html += `<td class="ora">${PERIOD_TIME[e.ora] || ('ora '+e.ora)}</td>`;
    html += `<td class="lesson"><span class="primary">${escapeHtml(niceClassLabel(e.classe))}</span>${!e.classeResolved?'<span class="tertiary">non riconosciuta</span>':''}</td>`;
    html += `<td class="lesson">${normale ? escapeHtml(normale) : '<span class="free">&mdash;</span>'}</td>`;
    if(e.tipo==='nota'){
      html += `<td class="lesson"><span class="note">${escapeHtml(e.testoRaw)}</span></td>`;
    } else {
      html += `<td class="lesson"><span class="primary">${escapeHtml(e.docente)}</span>${e.docenteAmbiguo?'<span class="tertiary">nome ambiguo, verifica</span>':''}</td>`;
    }
    html += '</tr>';
  });
  html += '</table></div></div>';
  output.innerHTML = html;
}

tabs.forEach(t => t.addEventListener('click', () => setMode(t.dataset.mode)));
select.addEventListener('change', render);

setMode('docente');
